# ── Data paths ──
# Set these to your local MIMIC-IV directories, or leave empty to use synthetic data.
# These can also be overridden via the .env file (environment variables take precedence).
data:
  mimic_iv_dir: ""          # e.g. /home/user/data/mimic-iv/2.2
  mimic_iv_note_dir: ""     # e.g. /home/user/data/mimic-iv-note/2.2
  synthetic_n_patients: 2000
  synthetic_seed: 42

# ── Run mode ──
# quick = small/fast (minutes) for development; full = the real run.
# Switch with `--mode quick|full` on the CLI, or change `mode` here.
run:
  mode: quick
  random_state: 42
  quick:
    n_rows: 4000            # subsample feature matrix to this many rows (0 = use all)
    optuna_trials: 15
    cv_folds: 3
  full:
    n_rows: 0
    optuna_trials: 400
    cv_folds: 5

# ── Cohort definition ──
cohort:
  readmission_window_days: 30
  min_age: 18
  exclude_in_hospital_death: true
  exclude_elective: true

# ── Feature engineering ──
features:
  lab_items:
    - glucose
    - creatinine
    - hemoglobin
    - white_blood_cells
    - platelets
    - sodium
    - potassium
    - bicarbonate
  vital_items:
    - heart_rate
    - systolic_bp
    - diastolic_bp
    - temperature
    - respiratory_rate
    - spo2
  lab_aggregates: [last, mean, min, max]   # aggregates computed per admission
  comorbidity_scheme: charlson             # charlson | elixhauser | both

# ── Stage 1: Classical ML ──
stage1:
  # Which model to train / tune. One of: logistic_regression | xgboost | histgradientboosting
  model: xgboost
  models:                                  # the full comparison set (for reference)
    - logistic_regression
    - xgboost
    - histgradientboosting

  # XGBoost only (no effect on LR/HGB). "cpu" locally (Mac has no CUDA) --
  # override with --device cuda on KISSKI/Grete (scripts/slurm_stage1_tune.sh
  # does this). Only changes which processor runs the search, not the search
  # itself or the result quality -- see src/model/models.py:build_estimator.
  device: cpu                              # cpu | cuda

  # ── Operating point policy ──
  # "capacity" (primary, from 2026-08-25 session): flag the top capacity_k
  # fraction of admissions by risk score, matched to what a transitional-care
  # team can realistically follow up on. Fixes the recall-floor policy's
  # deployability problem — at recall_floor=0.85 the old policy flagged 66.94%
  # of all admissions, which no hospital can act on.
  # "recall_floor" (secondary, kept for comparability with prior literature):
  # lowest threshold that still achieves target_recall.
  threshold_strategy: capacity             # capacity | recall_floor
  capacity_k: 0.15                         # primary operating point: top 15% of discharges
  capacity_report_points: [0.05, 0.10, 0.15, 0.20]  # precision@K / lift@K reported at these K
  target_recall: 0.85                      # secondary/comparability operating point
  recall_report_points: [0.80, 0.85, 0.90] # also report precision/specificity at these recalls
  test_size: 0.2
  use_smote: false                         # optional ablation; if true, applied INSIDE CV folds only
  early_stopping_rounds: 50                # XGBoost early stopping (n_estimators not tuned)
  n_estimators_cap: 2000                   # XGBoost upper bound used with early stopping

# ── Stage 2: Clinical encoder ──
# Model: Clinical-Longformer (Li et al. 2022, arXiv:2201.11838)
# Chosen over Bio_ClinicalBERT (512-token limit) and Clinical-BigBird:
#   - 4096-token context window handles full discharge notes (avg ~1900 tokens in MIMIC)
#   - Outperforms ClinicalBERT on all 10 benchmarks incl. MIMIC-AKI binary classification
#   - Authors explicitly recommend it over Clinical-BigBird for limited-resource settings
#   - Trained on MIMIC-III clinical notes — same domain as this project
stage2:
  # Local path set after running download_model.sh on the login node.
  # Compute nodes on KISSKI have no internet — model must be pre-downloaded.
  model_name: "models/clinical_longformer"

  # ── Sequence length ──
  # 4096 is Clinical-Longformer's native window (Li et al. 2022). Session 14
  # (2026-08-10) measured actual note length and found 74% of discharge notes
  # exceed 2048 tokens (median ~2,649) — the earlier "2048 covers ~100% of the
  # average note" estimate (session 9) was based on a since-corrected figure.
  # 4096 lets the large majority of notes fit without head+tail truncation.
  # Requires GPU. For CPU fallback set to 512 (expect degraded 70+ performance).
  max_seq_length: 4096

  # ── Patient-level data splits (within Stage 1 training patients) ──
  val_fraction: 0.20          # validation: early stopping & checkpoint selection
  calibration_fraction: 0.20  # calibration: Platt scaling + threshold selection
  # fine-tune fraction = 0.60 (implicit: 1 - val - cal)

  # ── Age × label stratified sampling for fine-tune set ──
  # Target note count per (age_band, readmission_30d_unplanned) cell.
  # 70+ is oversampled to address the recall gap found in the v1 model.
  #
  # Recomputed 2026-09-04 against REAL local MIMIC-IV data (Stage 1's actual
  # train-partition note-matched counts under the unplanned target -- not
  # estimated). The previous numbers here (all-cause-era: 18-40_1=10000,
  # 41-55_1=15000, 56-70_1=20000, 70+_1=30000, with _0 targets 25000/37000/
  # 50000/62000) requested more positive notes than exist under ANY label,
  # worst for 70+ (only 46.9% of its 30000 target actually available) -- and
  # because the "_0" targets were simultaneously close to fully achievable,
  # the silent per-cell fallback (_build_age_stratified_sample in
  # src/stage2/train.py, "use all available if short") inverted the
  # intended design: 70+ ended up the LEAST oversampled band (18.7%
  # positive) instead of the most, exactly backwards from the v1 recall-gap
  # fix this config exists to deliver. Every "_1" target below is now set
  # to its measured real ceiling (so the fallback never silently fires);
  # every "_0" target is scaled to reproduce each band's ORIGINAL intended
  # positive ratio using that real ceiling -- 70+ is deliberately the
  # highest (32.6%), as designed, not the lowest. Total drops from what was
  # actually being used before (~223k, achieved by accident, not by these
  # numbers) to ~167k -- a deliberate trade of data volume for actually
  # delivering the documented fairness intervention. Re-derive these
  # numbers again if the cohort, label, or MIMIC-IV release ever changes.
  age_group_train_targets:
    "18-40_0": 19772   # age 18-40, not readmitted  (scaled to match 18-40_1's real ceiling at the original ~28.6% ratio)
    "18-40_1": 7909    # age 18-40, readmitted      (real ceiling -- all available notes)
    "41-55_0": 29053   # age 41-55, not readmitted  (scaled to match 41-55_1's real ceiling at the original ~28.9% ratio)
    "41-55_1": 11777   # age 41-55, readmitted      (real ceiling -- all available notes)
    "56-70_0": 39388   # age 56-70, not readmitted  (scaled to match 56-70_1's real ceiling at the original ~28.6% ratio)
    "56-70_1": 15755   # age 56-70, readmitted      (real ceiling -- all available notes)
    "70+_0":   29068   # age 70+,   not readmitted  (scaled to match 70+_1's real ceiling at the original ~32.6% ratio)
    "70+_1":   14065   # age 70+,   readmitted      (real ceiling -- all available notes) ← still the most oversampled band, as designed

  # ── Training hyperparameters ──
  batch_size: 8
  gradient_accumulation_steps: 2   # effective batch size = 16
  epochs: 10
  early_stopping_patience: 3
  learning_rate: 1.0e-5
  warmup_ratio: 0.10
  weight_decay: 0.01
  # Checkpoint every N optimizer steps — crash recovery / HPC wall-time limit safety
  save_steps: 500

  # ── GPU / precision — set for your hardware before training ──
  # A100 80GB (GWDG Grete):  bf16: true,  fp16: false, gradient_checkpointing: false, workers: 8
  # A100 40GB:               bf16: true,  fp16: false, gradient_checkpointing: true,  workers: 8
  # V100 32GB:               bf16: false, fp16: true,  gradient_checkpointing: true,  workers: 4
  # RTX 4090 24GB:           bf16: false, fp16: true,  gradient_checkpointing: true,  workers: 4
  # RTX 3080 10GB:           bf16: false, fp16: true,  gradient_checkpointing: true,  workers: 4
  # CPU / macOS:             bf16: false, fp16: false, gradient_checkpointing: false, workers: 0
  bf16: true
  fp16: false
  gradient_checkpointing: false
  dataloader_num_workers: 8

  # ── Loss function ──
  focal_loss: true
  focal_gamma: 2.0
  # Per-age-group loss multiplier (applied on top of pos/neg class weights)
  age_group_loss_weights:
    "18-40": 1.0
    "41-55": 1.0
    "56-70": 1.1
    "70+":   1.3

  # ── Post-training calibration ──
  calibration_method: "platt"         # platt | isotonic
  threshold_strategy: "recall_floor"  # recall_floor | equal_ppv | f2_optimal
  recall_floor: 0.65                  # guaranteed minimum recall per age group

  # Fallback global threshold (used only if calibration has not been run)
  threshold: 0.30

# ── Stage 3: Explanation (optional) ──
# Model: google/medgemma-27b-text-it (switched from phi4-mini/Ollama
# 2026-09-10, now that the full batch run moved to KISSKI's A100 -- the
# phi4-mini/Ollama choice was specifically a laptop-CPU constraint, no
# longer binding on cluster GPU hardware). Chosen over Qwen2.5-32B-Instruct
# (clean Apache-2.0 fallback, no license ambiguity) because MedGemma is the
# only candidate benchmarked directly on MIMIC-IV-style reasoning
# (AgentClinic-MIMIC-IV), where it beat base Gemma 3 27B -- see session log.
# License: Health AI Developer Foundations terms
# (https://developers.google.com/health-ai-developer-foundations/terms) --
# checked 2026-09-10, permits this academic/research use (the Prohibited
# Use Policy bars illegal/harmful use and unlicensed practice of medicine
# as a real service, not research analysis of de-identified data with no
# clinical deployment -- matches this project's own stated scope, see
# MODEL_CARD.md's Limitations).
# Served via plain HF transformers.generate() + lm-format-enforcer for
# guided/structured JSON decoding. Mechanism history: Ollama's format=
# (session 15) -> vLLM's GuidedDecodingParams (2026-09-10, for cluster
# batch throughput) -> this (2026-09-15, after KISSKI's CUDA 12.8 driver
# ceiling proved structurally incompatible with vLLM's flashinfer/CUTLASS
# kernels regardless of vLLM/torch version -- see sessions/ for the full
# diagnosis). The schema-constrained-JSON guarantee is preserved across
# every switch. Compute nodes have no internet -- model must be
# pre-downloaded on the login node first, see download_stage3_model.sh.
stage3:
  # Absolute path on KISSKI project storage (2026-09-18), not
  # `models/medgemma-27b-text-it` under the repo -- moved off the user's
  # personal HOME quota (51GB alone put HOME at 177% of its 60GB soft
  # limit, with a 2-week grace period after which GWDG restricts writes
  # the same as hitting the 120GB hard limit, confirmed via GWDG's own
  # quota docs). Project storage (/mnt/vast-kisski, 5TB, <1% used as of
  # this move) has no such personal quota. Cluster/user-specific path,
  # consistent with this project's existing KISSKI-specific paths
  # elsewhere (e.g. the MIMIC-IV-Note location scripts reference).
  model_name: "/projects/extern/kisski/kisski-nova-rpcl/dir.project/thesis-models/medgemma-27b-text-it"
  # Secondary, scale-robustness arm (2026-08-27): re-run the same prompt
  # through a larger model to test whether the auditor's value depends on
  # model scale, turning the field's known "small local models may lack
  # reasoning capacity" risk into a tested result. NOT YET SET — the model
  # choice is a decision to confirm before use, not a default to assume:
  # a cloud API may not be permitted on MIMIC data under PhysioNet's Data
  # Use Agreement without checking first. Prefer a larger *local* model
  # unless that's explicitly verified. See docs/ARCHITECTURE.md.
  robustness_model: null
  # Pinned at 0 for reproducibility. Uphold/override is the primary outcome
  # variable for RQ2 — a stochastic auditor makes NRI a sample from a
  # distribution rather than a fixed, reportable quantity. Do not change this
  # for evaluation runs (session 15, 2026-08-25).
  temperature: 0.0
  attention_extraction: true     # extract Longformer attention spans (requires fine-tuned model)
  top_attention_sentences: 5     # sentences extracted per patient from attention weights
  top_shap_features: 5           # Stage 1 SHAP features included per patient in prompt
  # Discordance mode is computed quantitatively (percentile-rank displacement
  # of stage1_score vs stage2_score within the flagged+noted cohort), never by
  # the LLM. See src/stage3/explain.py:compute_discordance. Raw-probability
  # subtraction was tried and rejected (2026-08-25) because Stage 1 and Stage 2
  # scores are not guaranteed to be comparably calibrated even after isotonic
  # calibration — rank displacement is invariant to that risk.
  discordance_displacement_pp: 20.0  # |displacement| >= this (percentile points) => discordant
  # Patients per batched generate() call in batch.py (2026-09-15, after
  # measuring one-patient-at-a-time HF generation was too slow at scale:
  # 40 min for 10 patients extrapolates to weeks for the full ~9,800-
  # admission run). Conservative default -- VRAM headroom depends on note
  # length and hasn't been swept empirically yet; raise once real cluster
  # timing/VRAM headroom is confirmed.
  generation_batch_size: 4

# ── Output ──
output:
  model_dir: "models"
  log_dir: "logs"
  processed_dir: "data/processed"
